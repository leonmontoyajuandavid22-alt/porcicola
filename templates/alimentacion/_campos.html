{# Campos del formulario de alimentación (se usan al agregar y al editar). Espera "registro". #}
{% set r = registro %}
<label class="form-label">¿A quién? *</label>
<select name="destino" class="form-select mb-2" required>
  <option value="">Elige un corral o un cerdo...</option>
  <optgroup label="Un corral completo">
    {% for co in corrales %}
      {% set valor = "corral-" ~ co.id %}
      <option value="{{ valor }}" {{ "selected" if r.destino == valor }}>Corral {{ co.nombre }} ({{ co.n }} cerdos)</option>
    {% endfor %}
  </optgroup>
  <optgroup label="Un solo cerdo">
    {% for c in cerdos %}
      {% set valor = "cerdo-" ~ c.id %}
      <option value="{{ valor }}" {{ "selected" if r.destino == valor }}>{{ c.arete }}{% if c.nombre %} · {{ c.nombre }}{% endif %}</option>
    {% endfor %}
  </optgroup>
</select>

<label class="form-label">Fecha *</label>
<input name="fecha" type="date" class="form-control mb-2" required max="{{ hoy }}" value="{{ r.fecha or '' }}">

<label class="form-label">Tipo de alimento *</label>
{# Sugiere los alimentos que ya se usaron, para que se escriban siempre igual #}
<input name="tipo_alimento" class="form-control mb-2" required maxlength="100" list="lista-alimentos"
       value="{{ r.tipo_alimento or '' }}" placeholder="Ej. Concentrado de engorde">
<datalist id="lista-alimentos">
  {% for a in alimentos %}<option value="{{ a.tipo_alimento }}">{% endfor %}
</datalist>

<div class="row g-2">
  <div class="col-6">
    <label class="form-label">Cantidad (kg) *</label>
    <input name="cantidad_kg" type="number" step="0.01" min="0.01" class="form-control mb-2" required inputmode="decimal"
           value="{{ r.cantidad_kg or '' }}">
  </div>
  <div class="col-6">
    <label class="form-label">Costo total ($)</label>
    <input name="costo" type="number" step="0.01" min="0" class="form-control mb-2" inputmode="decimal" value="{{ r.costo or '' }}">
  </div>
</div>

<label class="form-label">Observaciones</label>
<input name="observaciones" class="form-control mb-3" maxlength="255" value="{{ r.observaciones or '' }}">
