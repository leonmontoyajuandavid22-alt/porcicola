{% extends "base.html" %}
{% block titulo %}Editar alimentación{% endblock %}
{% block contenido %}
<h1 class="h3 mb-3 titulo"><span class="icono-titulo"><i class="bi bi-basket2-fill"></i></span>Editar registro de alimentación</h1>
<form method="post" class="card card-body shadow-sm" style="max-width: 460px">
  <input type="hidden" name="volver" value="{{ registro.volver or '' }}">
  {% include "alimentacion/_campos.html" %}
  <div class="d-flex gap-2">
    <button class="btn btn-primario">Guardar</button>
    <a href="{{ url_for('cerdos.ficha', id=registro.cerdo_id) ~ '#alimentacion' if registro.volver == 'ficha' and registro.cerdo_id else url_for('alimentacion.lista') }}"
       class="btn btn-outline-secondary">Cancelar</a>
  </div>
</form>

<form method="post" action="{{ url_for('alimentacion.eliminar', id=registro.id) }}" class="mt-3"
      onsubmit="return confirm('¿Eliminar este registro de alimentación?')">
  <input type="hidden" name="volver" value="{{ registro.volver or '' }}">
  <button class="btn btn-sm btn-outline-danger">Eliminar registro</button>
</form>
{% endblock %}
