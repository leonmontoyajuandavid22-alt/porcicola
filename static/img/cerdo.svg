<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Cerdito de lado: se muestra cuando un cerdo no tiene foto -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdeef3"/>
      <stop offset="1" stop-color="#f9dce6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fondo)"/>
  <!-- pasto -->
  <ellipse cx="200" cy="262" rx="150" ry="16" fill="#cfe6b8"/>
  <!-- cola rizada -->
  <path d="M86 150 q-22 -6 -18 -22 q4 -14 16 -6 q8 6 -2 12" fill="none" stroke="#c2477a" stroke-width="5" stroke-linecap="round"/>
  <!-- patas de atrás -->
  <rect x="110" y="200" width="24" height="56" rx="10" fill="#e8799f"/>
  <rect x="236" y="200" width="24" height="56" rx="10" fill="#e8799f"/>
  <!-- cuerpo -->
  <ellipse cx="185" cy="170" rx="102" ry="70" fill="#f6a5c0" stroke="#c2477a" stroke-width="4"/>
  <!-- patas de adelante -->
  <rect x="136" y="206" width="24" height="52" rx="10" fill="#f6a5c0" stroke="#c2477a" stroke-width="4"/>
  <rect x="262" y="206" width="24" height="52" rx="10" fill="#f6a5c0" stroke="#c2477a" stroke-width="4"/>
  <!-- oreja de atrás -->
  <path d="M268 92 L276 58 L300 92 Z" fill="#e8799f" stroke="#c2477a" stroke-width="4" stroke-linejoin="round"/>
  <!-- cabeza -->
  <circle cx="290" cy="140" r="50" fill="#f6a5c0" stroke="#c2477a" stroke-width="4"/>
  <!-- oreja de adelante -->
  <path d="M296 96 L316 62 L330 104 Z" fill="#e8799f" stroke="#c2477a" stroke-width="4" stroke-linejoin="round"/>
  <!-- ojo y mejilla -->
  <circle cx="300" cy="128" r="6" fill="#3b2330"/>
  <circle cx="302" cy="126" r="2" fill="#fff"/>
  <circle cx="294" cy="156" r="9" fill="#f28bb0" opacity="0.7"/>
  <!-- trompa -->
  <ellipse cx="338" cy="148" rx="16" ry="20" fill="#e8799f" stroke="#c2477a" stroke-width="4"/>
  <ellipse cx="334" cy="142" rx="3" ry="4.5" fill="#9c3260"/>
  <ellipse cx="342" cy="154" rx="3" ry="4.5" fill="#9c3260"/>
  <!-- sonrisa -->
  <path d="M306 172 q10 8 20 0" fill="none" stroke="#9c3260" stroke-width="3" stroke-linecap="round"/>
  <!-- manchas -->
  <ellipse cx="160" cy="150" rx="22" ry="16" fill="#e8799f" opacity="0.5"/>
  <ellipse cx="210" cy="196" rx="14" ry="10" fill="#e8799f" opacity="0.5"/>
</svg>
